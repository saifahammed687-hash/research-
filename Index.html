<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Student Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .navbar { background-color: #2c3e50; color: white; padding: 1rem; text-align: center; }
        .container { width: 80%; margin: 20px auto; display: flex; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .task-list { list-style: none; padding: 0; }
        .task-item { background: #ecf0f1; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; }
        .priority-high { border-left: 5px solid red; }
    </style>
</head>
<body>

<div class="navbar">
    <h1>StudyFlow: Smart Student Dashboard</h1>
</div>

<div class="container">
    <!-- টাস্ক ইনপুট করার জায়গা -->
    <div class="card">
        <h2>নতুন টাস্ক যোগ করো</h2>
        <input type="text" id="taskTitle" placeholder="অ্যাসাইনমেন্টের নাম...">
        <select id="priority">
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
        </select>
        <input type="date" id="deadline">
        <button onclick="addTask()">টাস্ক সেভ করো</button>
    </div>

    
    <div class="card">
        <h2>তোমার টাস্কসমূহ</h2>
        <ul id="taskList" class="task-list">
            <!-- এখানে টাস্কগুলো দেখা যাবে -->
        </ul>
    </div>
</div>

<script>
    function addTask() {
        let title = document.getElementById('taskTitle').value;
        let priority = document.getElementById('priority').value;
        let deadline = document.getElementById('deadline').value;

        if(title === '') { alert("টাস্কের নাম লিখুন!"); return; }

        let list = document.getElementById('taskList');
        let li = document.createElement('li');
        li.className = 'task-item' + (priority === 'High' ? ' priority-high' : '');
        li.innerHTML = `<span><strong>${title}</strong> (${deadline})</span> <span>[${priority}]</span>`;
        list.appendChild(li);

        // ফর্ম ক্লিয়ার করা
        document.getElementById('taskTitle').value = '';
    }
</script>

</body>
</html>
